[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eleicao"
version = "0.1.0"
description = "Coleta, processamento e visualização dos resultados das Eleições 2026 (TSE)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
[tool.ruff.lint.per-file-ignores]
# Notebooks de análise: formato de célula (linhas longas, `;`, imports em linha) e o cabeçalho
# com sys.path antes dos imports (E402) não são revisados aqui. Erros reais (F, B) continuam
# valendo. A lógica fica nas funções testadas em src/eleicao/analise/.
"notebooks/*.ipynb" = ["E402", "F401", "I001", "E501", "E702", "E401", "B905"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["geo: usa a malha municipal do geobr (rede/cache, ~10 s)"]
