<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Presidente 2026 — 1º turno | mapa de resultados</title>
<meta name="description" content="Mapa interativo do resultado do 1º turno da eleição presidencial de 2026, por UF e por município, a partir dos dados oficiais do TSE.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://larrybers87.github.io/analise_eleicoes_2026/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Presidente 2026 · mapa e análises">
<meta property="og:title" content="Presidente 2026, 1º turno: mapa de resultados por município">
<meta property="og:description" content="Mapa interativo do 1º turno da eleição presidencial de 2026 por estado e por município, com os dados oficiais do TSE: quem venceu, a força de cada candidato e o swing de 2022 para 2026.">
<meta property="og:url" content="https://larrybers87.github.io/analise_eleicoes_2026/">
<meta property="og:image" content="https://larrybers87.github.io/analise_eleicoes_2026/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="Mapa do Brasil por município colorido pela mistura dos votos de Flávio Bolsonaro (azul) e Lula (vermelho) no 1º turno de 2026">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Presidente 2026, 1º turno: mapa de resultados por município">
<meta name="twitter:description" content="Mapa interativo do 1º turno da eleição presidencial de 2026 por estado e por município, com os dados oficiais do TSE: quem venceu, a força de cada candidato e o swing de 2022 para 2026.">
<meta name="twitter:image" content="https://larrybers87.github.io/analise_eleicoes_2026/img/og.png">
<meta name="twitter:image:alt" content="Mapa do Brasil por município com o resultado do 1º turno de 2026">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header id="topo">
  <div id="titulo">
    <strong>Presidente 2026</strong><span class="sep">·</span><span id="subtitulo">1º turno</span>
  </div>

  <nav id="trilha" aria-label="Navegação">
    <!-- breadcrumb preenchido por js/app.js -->
  </nav>

  <nav class="topo-links" aria-label="Páginas">
    <a href="index.html" class="atual" aria-current="page">Mapa</a>
    <a href="analises.html">Análises</a>
  </nav>

  <div id="busca-caixa">
    <input id="busca" type="search" autocomplete="off" spellcheck="false"
           placeholder="Buscar município…" aria-label="Buscar município por nome">
    <ul id="busca-resultados" hidden role="listbox"></ul>
  </div>
</header>

<main>
  <div id="mapa" role="application" aria-label="Mapa de resultados"></div>

  <div id="controles">
    <div class="grupo" role="group" aria-label="Camada">
      <button type="button" data-camada="uf" class="ativo" title="Brasil por UF">
        <span class="longo">Brasil por UF</span><span class="curto">UF</span>
      </button>
      <button type="button" data-camada="mun" title="Brasil por município">
        <span class="longo">Brasil por município</span><span class="curto">Município</span>
      </button>
    </div>
    <div class="grupo" id="grupo-modo" role="group" aria-label="Modo de cor">
      <button type="button" data-modo="mistura" class="ativo" title="Mistura ponderada pelos votos">
        Mistura
      </button>
      <button type="button" data-modo="margem" title="Cor do vencedor, intensidade pela margem">
        <span class="longo">Vencedor + margem</span><span class="curto">Margem</span>
      </button>
      <button type="button" data-modo="swing" title="Mudança da margem PL − PT do 1º turno de 2022 para o de 2026">
        <span class="longo">Swing 2022→2026</span><span class="curto">Swing</span>
      </button>
    </div>
    <div class="grupo grupo-sel">
      <label for="candidato">Candidato</label>
      <i id="cor-candidato" hidden aria-hidden="true"></i>
      <select id="candidato" aria-label="Destacar um candidato no mapa">
        <option value="">Nenhum</option>
      </select>
    </div>
    <div class="grupo" id="grupo-modo-cand" role="group" aria-label="Modo do candidato" hidden>
      <button type="button" data-cmodo="venceu" class="ativo"
              title="Só os lugares em que ele foi 1º colocado, na cor dele pela margem">
        <span class="longo">Onde venceu</span><span class="curto">Venceu</span>
      </button>
      <button type="button" data-cmodo="forca"
              title="Todos os lugares, pela porcentagem de votos válidos dele">
        <span class="longo">Força (% válidos)</span><span class="curto">Força</span>
      </button>
    </div>
    <button type="button" id="btn-voltar" hidden>← Voltar</button>
  </div>

  <div id="legenda" aria-live="polite"></div>

  <div id="tooltip" hidden></div>

  <aside id="painel" aria-label="Resultados da região selecionada">
    <button type="button" id="painel-alternar" aria-expanded="true">Resultados</button>
    <div id="painel-conteudo"></div>
  </aside>
</main>

<footer id="pe">
  <span id="pe-fonte">Carregando…</span>
  <span id="pe-extra"></span>
  <span id="pe-aviso">Projeto pessoal e não oficial, por Larry Bertoncello. Dados do
    <a href="https://resultados.tse.jus.br" target="_blank" rel="noopener">TSE</a> (provisórios até a
    totalização final) e do IBGE ·
    <a href="https://github.com/larrybers87/analise_eleicoes_2026" target="_blank" rel="noopener">código no GitHub</a></span>
</footer>

<div id="modal-exterior" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="modal-caixa">
    <header>
      <h2 id="modal-titulo">Exterior</h2>
      <button type="button" id="modal-fechar" aria-label="Fechar">×</button>
    </header>
    <p class="nota" id="modal-nota"></p>
    <div class="tabela-rolagem">
      <table id="tabela-exterior">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div id="carregando" hidden><span></span></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
