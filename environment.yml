name: eleicao2026
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas>=2.2
  - pyarrow
  - duckdb
  - httpx
  - tenacity
  - geopandas
  - shapely
  - pyproj
  - topojson
  - matplotlib
  - plotly
  - jupyterlab
  - ipykernel
  - nbstripout   # filtro git: limpa outputs de .ipynb no commit (rodar `nbstripout --install` após clonar)
  - tqdm
  - pyyaml      # carrega config/candidatos.yaml (paleta de cores)
  - scipy       # testes estatísticos (Kruskal-Wallis, Pearson, Spearman) da F3
  - statsmodels # WLS ecológico (15_perfil) com pesos pelo eleitorado
  - libpysal    # pesos queen e Moran (16_espacial)
  - esda        # Moran global e LISA (16_espacial)
  - cvxpy       # Goodman com restrições (F5a, inferência ecológica); conda-forge, mantém OpenBLAS
  # BLAS OpenBLAS (e não MKL): com MKL 2026.1 no Windows, np.cov/matmul derrubavam o
  # interpretador (exit 0xc06d007f). Ver docs/DECISOES.md D-020.
  - libblas=*=*openblas
  - libcblas=*=*openblas
  - liblapack=*=*openblas
  - ruff
  - pytest
  - pip
  - pip:
      - geobr
      - coloraide   # conversões OKLab para mistura de cores
      - -e .
