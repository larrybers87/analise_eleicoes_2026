# Paleta de cores — Presidente 2026, 1º turno (12 candidatos)
#
# Fonte de `nr`/`nm_urna`/`partido`/`votos_br`/`pct_validos_br`:
# data/processed/presidente_t1_br.parquet (snapshot registrado em
# data/processed/snapshot_6257.json). Esses 5 campos são DADO — não editar
# à mão; se o parquet for atualizado (ex. totalização final), regenerar
# este arquivo a partir dele. Só `cor_hex`/`grupo`/`oklch` são DECISÃO DE
# DESIGN, definidas nesta tarefa e descritas em docs/DECISOES.md (D-013,
# D-014 — D-014 é a revisão pedida pelo usuário após ver o preview inicial).
#
# Modelo de cor: OKLCH (L, C, H) — perceptualmente uniforme, convertido para
# sRGB hex (ver src/eleicao/cores.py). `oklch` abaixo é só documentação de
# como `cor_hex` foi derivado; o código em produção lê apenas `cor_hex`.
# `oklch.h` é omitido para os candidatos acromáticos (C=0 — matiz
# indefinido/irrelevante nesse caso).
#
# Grupos:
#   principal  — PT (13, vermelho) e PL (22, azul): luminosidade OKLab
#                parecida (|ΔL| < 0.05) e croma alto.
#   secundario — 3º, 4º e 5º colocados (ver D-014: o 5º colocado foi
#                promovido deste grupo "menor" para "secundario" a pedido
#                do usuário, com croma visivelmente maior que antes): hues
#                distintos entre si e fora da FAIXA RESERVADA PT×PL (ver
#                abaixo), croma médio (~0,13).
#   menor      — 6º a 12º colocados (<1% dos votos válidos nacionais):
#                CINZA (acromático, C=0), luminosidades `L` diferentes
#                entre si — ver "Decisão de design #2" abaixo sobre por que
#                não usamos hues de croma baixo aqui desta vez.
#
# ============================================================================
# FAIXA RESERVADA PT×PL (D-014) — nenhum outro candidato pode ter matiz (H)
# dentro dela.
#
# O usuário pediu para reservar, só para a mistura PT×PL, a faixa de matiz
# que o gradiente `mistura_oklab` entre os dois efetivamente percorre em
# OKLCH. Medimos variando o gradiente PT↔PL de 0% a 100% em passos finos
# (1000 pontos) e convertendo cada ponto para OKLCH: o matiz percorrido vai
# de H=261,92° (PL puro, #306adb) a H=29,04° (PT puro, #d01f17),
# MONOTONICAMENTE, passando por azul→roxo→magenta→rosa→vermelho (nunca por
# verde/amarelo — é uma propriedade de como OKLab mistura linearmente duas
# cores "opostas": o caminho cruza perto da origem (a≈0,b≈0), não contorna
# o círculo de matizes).
#
# Faixa reservada usada na prática (`src/eleicao/cores.py`,
# `FAIXA_RESERVADA_PT_PL`): H em [260°, 360°) ∪ [0°, 30°) — arredondamos o
# intervalo medido (261,92°–29,04°) para fora por ~2° de margem de
# segurança. Nenhum dos outros 10 candidatos tem H dentro dessa faixa
# (conferido candidato a candidato abaixo).
# ============================================================================
#
# Decisão de design #1 (D-013, mantida): a cor de PT (H=29°) e PL (H=262°)
# propriamente ditas não são verde/amarelo, e por já estarem fora da faixa
# verde/amarelo o gradiente PT↔PL (que passa pela faixa reservada acima)
# também não cruza verde/amarelo — cumprido automaticamente.
#
# Decisão de design #2 (D-014, NOVA — revisar): os 7 candidatos "menor"
# (6º a 12º colocados) usam CINZA (C=0) em vez de hues de croma baixo como
# na primeira proposta. Critério: testamos (sessão anterior, ΔE OKLab entre
# pares de hue de croma baixo na faixa permitida) e croma baixo (~0,05-0,07)
# colide fortemente sob deuteranopia quando há vários candidatos a
# distribuir — ΔE caía a ~0,5-2,6 (limiar adotado: 0,10) mesmo fora da
# faixa reservada. Com a faixa reservada agora tomando ~127° do círculo de
# matizes (260°-390°) e 3 matizes "secundário" (verde 156°, ciano 200°,
# âmbar 75°) já ocupando parte do espaço restante, não sobrava margem para
# 7 hues mutuamente distintos, distintos dos 3 "secundário", E seguros sob
# CVD ao mesmo tempo — então usamos cinza (CVD-safe por definição: escala
# de cinza não é afetada por nenhum tipo de daltonismo, que afeta percepção
# de matiz/croma, não luminância) com `L` espaçado (0,35 a 0,77, step 0,07)
# em vez de tentar mais uma rodada de matizes artificiais colidindo.
#
# Decisão de design #3 (D-014, NOVA — revisar, achado importante): o 5º
# colocado (Ronaldo Caiado, âmbar H=75°, a pedido do usuário) tem ΔE muito
# baixo contra PT (vermelho H=29°) sob deuteranopia — 0,063, bem abaixo do
# limiar 0,10 (ver tabela completa no relatório da sessão/notebook). Isso é
# uma propriedade inerente de tons âmbar/ocre: ficam no mesmo lado do eixo
# de confusão vermelho-verde da deuteranopia que o vermelho puro. Testamos
# H de 55° a 90° para Caiado e H de 185° a 230° para Renan (buscando
# melhorar o pior caso) e o mínimo não passa de ~0,06 — não é uma questão
# de ajuste fino, é um limite físico do tom "âmbar" nesse tipo de
# daltonismo. Mantivemos H=75° (pedido explícito do usuário); se a
# distinguibilidade de Caiado sob deuteranopia for crítica, a única saída
# real é abandonar "âmbar/ocre" por um matiz mais distante do vermelho.
#
# REGRA (e): brancos, nulos e abstenção NÃO entram aqui — são métricas
# separadas (ver presidente_t1_*_totais.parquet), não compõem a mistura de
# cor do mapa. `mistura_oklab`/`vencedor_margem` em src/eleicao/cores.py só
# aceitam `{nr_candidato: votos}` sobre votos válidos.

